# Runs the PHP test suite, the TypeScript typecheck and the federated bundle
# build on every pull request and on pushes to main and release branches.
# The release workflow runs the same PHP suite before it builds a ZIP.
name: CI

on:
    pull_request:
    push:
        branches:
            - main
            - 'release/**'

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Run the test suite
              run: composer test

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Typecheck
              run: npm run typecheck

            - name: Build the federated bundle
              run: npm run build
